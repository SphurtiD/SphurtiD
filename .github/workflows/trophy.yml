name: Generate trophy card

on:
  schedule: # execute every 12 hours (at minute 0)
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: dist/trophy.svg # Updated from 'file' to 'output_path'
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dracula
          # Removed unexpected inputs ('max-rows', 'margin-width', 'margin-height', 'no-background', 'no-frame')

      - name: push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
